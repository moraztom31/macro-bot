name: Briefing Macro Quotidien
on:
  schedule:
    # Les crons GitHub gratuits tournent souvent en retard (parfois 6 à 10 heures).
    # Le premier passage de la journée après 7h (Paris) envoie le briefing, les suivants
    # sont ignorés grâce au fichier d'état last_sent.txt. Pour un envoi à heure fixe,
    # déclencher le workflow depuis cron-job.org (voir README).
    - cron: "45 5 * * *"
    - cron: "15 6 * * *"
    - cron: "45 6 * * *"
    - cron: "15 7 * * *"
    - cron: "45 7 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions, ou à heure fixe via un déclencheur externe (voir README)
    inputs:
      dry_run:
        description: "Test : affiche le briefing dans les logs sans l'envoyer"
        type: boolean
        default: false
permissions:
  contents: write  # nécessaire pour commiter le fichier d'état last_sent.txt
concurrency:
  group: briefing          # un seul passage à la fois : évite deux envois quand plusieurs crons en retard arrivent ensemble
  cancel-in-progress: false
jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installation des dépendances
        run: pip install yfinance requests
      - name: Envoi du briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run && '1' || '0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: python macro_bot.py
      - name: Sauvegarde de l'état anti-doublon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f last_sent.txt ]; then
            git add last_sent.txt
            if git diff --cached --quiet; then
              echo "Pas de changement d'état à sauvegarder."
            else
              git commit -m "État: briefing envoyé $(date -u +%Y-%m-%d)"
              git push
            fi
          else
            echo "last_sent.txt n'existe pas (aucun envoi effectué) — rien à sauvegarder."
          fi
