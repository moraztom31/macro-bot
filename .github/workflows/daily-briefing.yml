name: Briefing Macro Quotidien

on:
  schedule:
    # Les crons GitHub gratuits tournent souvent en retard (parfois plusieurs heures).
    # On multiplie donc les créneaux entre 5h et 8h UTC (7h-10h heure française selon
    # été/hiver) : le premier run qui tombe dans la fenêtre envoie le briefing,
    # les suivants sont ignorés grâce au fichier d'état last_sent.txt.
    - cron: "45 5 * * *"
    - cron: "15 6 * * *"
    - cron: "45 6 * * *"
    - cron: "15 7 * * *"
    - cron: "45 7 * * *"
    - cron: "15 8 * * *"
  workflow_dispatch: {}  # permet de lancer le workflow manuellement depuis l'onglet Actions

permissions:
  contents: write  # nécessaire pour commiter le fichier d'état last_sent.txt

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: pip install yfinance requests

      - name: Envoi du briefing
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python macro_bot.py

      - name: Sauvegarde de l'état anti-doublon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_sent.txt
          if git diff --cached --quiet; then
            echo "Pas de changement d'état à sauvegarder."
          else
            git commit -m "État: briefing envoyé $(date -u +%Y-%m-%d)"
            git push
          fi
